<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>本益比河流圖 - PE River Chart</title>
  <!-- Chart.js from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f7fa;
      color: #333;
      padding: 20px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #1a1a2e;
    }
    .search-bar {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }
    .search-bar input {
      padding: 10px 16px;
      font-size: 16px;
      border: 2px solid #ddd;
      border-radius: 8px;
      width: 200px;
      transition: border-color 0.3s;
    }
    .search-bar input:focus {
      outline: none;
      border-color: #4361ee;
    }
    .search-bar button {
      padding: 10px 24px;
      font-size: 16px;
      background: #4361ee;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
    }
    .search-bar button:hover { background: #3a56d4; }
    .search-bar button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }
    .chart-container {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      position: relative;
    }
    .info-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .info-bar .stock-info {
      font-size: 18px;
      font-weight: 600;
    }
    .info-bar .eps-info {
      font-size: 14px;
      color: #666;
    }
    .info-bar .cache-badge {
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 4px;
      background: #e8f5e9;
      color: #2e7d32;
    }
    #loading {
      display: none;
      text-align: center;
      padding: 60px 20px;
      font-size: 18px;
      color: #666;
    }
    #loading.show { display: block; }
    #error {
      display: none;
      text-align: center;
      padding: 20px;
      color: #d32f2f;
      background: #ffebee;
      border-radius: 8px;
      margin-bottom: 15px;
    }
    #error.show { display: block; }
    .legend-note {
      text-align: center;
      margin-top: 12px;
      font-size: 13px;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📈 本益比河流圖</h1>
    <div class="search-bar">
      <input type="text" id="stockInput" placeholder="輸入股票代號 (例: 2330)" maxlength="6" />
      <button id="searchBtn" onclick="queryStock()">查詢</button>
    </div>
    <div id="error"></div>
    <div id="loading">⏳ 正在從證交所取得資料，首次查詢可能需要 30-60 秒...</div>
    <div class="chart-container">
      <div class="info-bar" id="infoBar" style="display:none;">
        <span class="stock-info" id="stockInfo"></span>
        <span class="eps-info" id="epsInfo"></span>
        <span class="cache-badge" id="cacheBadge" style="display:none;">快取資料</span>
      </div>
      <canvas id="peChart" width="960" height="450"></canvas>
    </div>
    <p class="legend-note">色帶由下而上代表 PE 10x → 35x，黑色實線為實際股價走勢</p>
  </div>

  <script>
    // API base URL - change to your Vercel deployment URL
    const API_BASE = window.location.origin;

    let chartInstance = null;

    // Allow Enter key to trigger search
    document.getElementById('stockInput').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') queryStock();
    });

    async function queryStock() {
      const input = document.getElementById('stockInput');
      const btn = document.getElementById('searchBtn');
      const loading = document.getElementById('loading');
      const errorDiv = document.getElementById('error');
      const infoBar = document.getElementById('infoBar');

      const stockNo = input.value.trim();
      if (!stockNo || !/^\d{4,6}$/.test(stockNo)) {
        showError('請輸入有效的股票代號（4-6 位數字）');
        return;
      }

      // Reset UI
      errorDiv.classList.remove('show');
      loading.classList.add('show');
      btn.disabled = true;
      infoBar.style.display = 'none';

      try {
        const res = await fetch(`${API_BASE}/api/getPeRiver?stock=${encodeURIComponent(stockNo)}`);
        const data = await res.json();

        if (!res.ok) {
          showError(data.error || '查詢失敗');
          return;
        }

        renderChart(data);
      } catch (err) {
        showError('網路錯誤，請確認 API 是否正常運作: ' + err.message);
      } finally {
        loading.classList.remove('show');
        btn.disabled = false;
      }
    }

    function showError(msg) {
      const errorDiv = document.getElementById('error');
      errorDiv.textContent = msg;
      errorDiv.classList.add('show');
      document.getElementById('loading').classList.remove('show');
      document.getElementById('searchBtn').disabled = false;
    }

    function renderChart(data) {
      const infoBar = document.getElementById('infoBar');
      const stockInfo = document.getElementById('stockInfo');
      const epsInfo = document.getElementById('epsInfo');
      const cacheBadge = document.getElementById('cacheBadge');

      // Show info bar
      infoBar.style.display = 'flex';
      stockInfo.textContent = `股票代號: ${data.stockNo}`;
      epsInfo.textContent = `近四季 EPS: ${data.latestEPS} 元`;
      cacheBadge.style.display = data.cached ? 'inline' : 'none';

      // Prepare chart data
      const labels = data.priceData.map((p) => p.date);
      const priceValues = data.priceData.map((p) => p.close);

      // PE band colors (bottom to top: green → yellow → orange → red)
      const bandColors = [
        'rgba(76, 175, 80, 0.3)',   // PE 10 - green (undervalued)
        'rgba(139, 195, 74, 0.3)',  // PE 15 - light green
        'rgba(255, 235, 59, 0.3)',  // PE 20 - yellow
        'rgba(255, 152, 0, 0.3)',   // PE 25 - orange
        'rgba(244, 67, 54, 0.3)',   // PE 30 - red
        'rgba(156, 39, 176, 0.2)',  // PE 35 - purple (overvalued)
      ];

      const borderColors = [
        'rgba(76, 175, 80, 0.8)',
        'rgba(139, 195, 74, 0.8)',
        'rgba(255, 235, 59, 0.8)',
        'rgba(255, 152, 0, 0.8)',
        'rgba(244, 67, 54, 0.8)',
        'rgba(156, 39, 176, 0.6)',
      ];

      // Build datasets
      const datasets = data.peRiverBands.map((band, idx) => ({
        label: band.label,
        data: band.values.map((v) => v.value),
        borderColor: borderColors[idx],
        backgroundColor: bandColors[idx],
        borderWidth: 1,
        fill: idx === 0 ? 'origin' : '-1',
        pointRadius: 0,
        tension: 0.3,
        order: data.peRiverBands.length - idx, // Draw lower bands first
      }));

      // Add actual stock price line
      datasets.push({
        label: '實際股價',
        data: priceValues,
        borderColor: '#000',
        backgroundColor: 'transparent',
        borderWidth: 2.5,
        pointRadius: 0,
        tension: 0.3,
        fill: false,
        order: 0, // Draw on top
      });

      // Destroy previous chart
      if (chartInstance) {
        chartInstance.destroy();
      }

      const ctx = document.getElementById('peChart').getContext('2d');
      chartInstance = new Chart(ctx, {
        type: 'line',
        data: { labels, datasets },
        options: {
          responsive: true,
          interaction: {
            mode: 'index',
            intersect: false,
          },
          plugins: {
            legend: {
              position: 'top',
              labels: { usePointStyle: true, padding: 15 },
            },
            tooltip: {
              callbacks: {
                label: function (context) {
                  return `${context.dataset.label}: ${context.parsed.y?.toFixed(1)} 元`;
                },
              },
            },
          },
          scales: {
            x: {
              title: { display: true, text: '月份' },
              ticks: { maxTicksLimit: 12 },
            },
            y: {
              title: { display: true, text: '股價 (TWD)' },
              beginAtZero: false,
            },
          },
        },
      });
    }
  </script>
</body>
</html>
